<!DOCTYPE html>
<html lang="zh-Hans-MY">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>跳转中… — OpenToday｜今日开业</title>
<script>
// 旧链接 business.html?id=X → 跳到新静态页 /business/{slug}/
(function(){
  var id = new URLSearchParams(location.search).get("id");
  if(!id){ location.replace("/explore.html"); return; }
  function go(slug){ location.replace(slug ? ("/business/" + slug + "/") : "/explore.html"); }
  // 先查生成时的 id→slug 映射（最快）
  fetch("/id-slug-map.json?v=" + Date.now())
    .then(function(r){ return r.ok ? r.json() : {}; })
    .then(function(map){
      if(map && map[id]){ go(map[id]); return; }
      // 不在映射里（可能刚发布还没重生成）→ 直接查 Supabase 拿 slug
      var SB="https://jumzzfvgkqsfeypbpgcq.supabase.co", K="sb_publishable_QspxuW5zHogZs2d3Uyl4lA_LEHGjHSI";
      fetch(SB+"/rest/v1/public_customers?id=eq."+encodeURIComponent(id)+"&select=slug",{headers:{apikey:K,Authorization:"Bearer "+K}})
        .then(function(r){ return r.json(); })
        .then(function(rows){ go(rows && rows[0] && rows[0].slug); })
        .catch(function(){ go(null); });
    })
    .catch(function(){ go(null); });
})();
</script>
</head>
<body style="font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:60px 20px;color:#666;">
  正在带你去商家页…
</body>
</html>
