name: 生成商家静态页

on:
  schedule:
    - cron: "*/20 * * * *"      # 每 20 分钟自动跑一次（主力）
  workflow_dispatch:            # 手动「Run workflow」按钮
  repository_dispatch:          # Supabase Webhook 触发（近实时，第二阶段用）
    types: [business-updated]

permissions:
  contents: write

concurrency:
  group: build-static
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 生成静态页
        run: node scripts/build.mjs

      - name: 有变动才提交
        run: |
          git config user.name "opentoday-bot"
          git config user.email "bot@users.noreply.github.com"
          git add business sitemap.xml id-slug-map.json index.html explore.html
          if git diff --cached --quiet; then
            echo "没有变动，跳过。"
          else
            git commit -m "自动：重新生成商家静态页"
            git pull --rebase --autostash || true
            git push
          fi
